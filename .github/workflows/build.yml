name: Build CodeInjector APK

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Executa diariamente às 12:00 UTC

permissions:
  contents: read

concurrency:
  group: codeinjector-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python 3.11 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Encontrar e extrair o projeto ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          # Usa o ZIP do projeto como fonte principal, se existir.
          while IFS= read -r -d '' archive; do
            if unzip -Z1 "$archive" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              DEST="$RUNNER_TEMP/codeinjector-source"
              mkdir -p "$DEST"
              unzip -oq "$archive" -d "$DEST"
              PROJECT_DIR="$(find "$DEST" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
              if [[ -n "$PROJECT_DIR" ]]; then
                echo "Projeto encontrado no ZIP: $archive"
                break
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print0)

          # Alternativa: compila os arquivos já extraídos no repositório.
          if [[ -z "$PROJECT_DIR" ]]; then
            if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" || -f "$GITHUB_WORKSPACE/settings.gradle" ]]; then
              PROJECT_DIR="$GITHUB_WORKSPACE"
            else
              echo "ERRO: não encontrei um ZIP com settings.gradle(.kts), nem um projeto Gradle na raiz." >&2
              echo "Confirme que o ZIP do CodeInjector contém o projeto Android." >&2
              exit 1
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Diretório que será compilado: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Remove o serviço de acessibilidade da cópia extraída antes de compilar.
      # O ZIP original no repositório não é alterado.
      - name: Remover serviço de acessibilidade
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          manifest = root / "app/src/main/AndroidManifest.xml"
          android_ns = "{http://schemas.android.com/apk/res/android}"

          if manifest.exists():
              tree = ET.parse(manifest)
              app = tree.getroot().find("application")
              changed = False

              if app is not None:
                  for service in list(app.findall("service")):
                      actions = [
                          action.get(android_ns + "name")
                          for intent_filter in service.findall("intent-filter")
                          for action in intent_filter.findall("action")
                      ]
                      if "android.accessibilityservice.AccessibilityService" in actions:
                          app.remove(service)
                          changed = True
                          print("Declaração do serviço de acessibilidade removida.")

              if changed:
                  tree.write(manifest, encoding="utf-8", xml_declaration=True)
              else:
                  print("Nenhuma declaração de serviço de acessibilidade encontrada.")

          config = root / "app/src/main/res/xml/accessibility_service_config.xml"
          if config.exists():
              config.unlink()
              print("Arquivo accessibility_service_config.xml removido.")
          PY

      - name: Compilar APK Debug
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeInjector-debug-apk
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
