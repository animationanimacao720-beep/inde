name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          ls -la
          rm -rf CodeInjector
          Z=CodeInjector-Python.zip
          [ -f "$Z" ] || Z=$(ls *.zip | head -1)
          echo "usando: $Z"
          unzip -qo "$Z"
      - name: Remover arquivos antigos
        run: |
          rm -rf CodeInjector/app/src/main/res/xml
          rm -f CodeInjector/app/src/main/java/com/dev/codeinjector/{CodeRunner,TermuxRunner,JavaRunner,TextInjectorService}.kt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Compilar
        run: gradle assembleDebug --no-daemon
        working-directory: CodeInjector
      - uses: actions/upload-artifact@v4
        with:
          name: CodeInjector-debug-apk
          path: CodeInjector/app/build/outputs/apk/debug/*.apk
